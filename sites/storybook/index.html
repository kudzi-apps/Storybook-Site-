<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#211b18">
<title>Storybook — A wedding, beautifully lived</title>
<meta name="description" content="A considered digital home for your wedding day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<div id="app">
<header class="topbar">
<a class="wordmark" href="#" aria-label="Storybook home"><span class="mark">S</span><span>STORYBOOK</span></a>
<nav id="nav" aria-label="Main pages">
<button class="active" type="button">RSVP</button>
<button type="button">Venue</button>
<button type="button">Gallery</button>
</nav>
<span class="guest-label">A. &amp; J. · 05 NOV 2026</span>
</header>
<main>
<div class="intro">
<span class="eyebrow">A DAY TO REMEMBER</span>
<h1 id="page-title">A day to <em>remember.</em></h1>
<p id="page-subtitle">A celebration of love, friendship and everything in between.</p>
</div>
<section id="stage" class="stage" aria-live="polite"></section>
</main>
<footer class="bottombar">
<div class="event-status"><span class="status-dot"></span><div><small id="status-kicker">COUNTING DOWN</small><strong id="status-main">3 days to go</strong></div></div>
<div class="ticker" id="ticker">We cannot wait to celebrate with you · Alexandra &amp; James · 5 November 2026 · </div>
<button class="quiet" id="demo-toggle" type="button">Preview event state</button>
</footer>
<button class="happening-now" id="happening-now" type="button">HAPPENING NOW ↗</button>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Storybook details"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>

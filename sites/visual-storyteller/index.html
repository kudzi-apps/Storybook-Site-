<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090a0c">
<title>Visual Storyteller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="./index.html" aria-label="Visual Storyteller home"><span class="brand-mark">VS</span><span>VISUAL STORYTELLER</span></a>
  <button class="top-action" id="contact">CONTACT <span>↗</span></button>
</header>
<main class="stage" id="stage">
  <div class="world" id="world">
    <div class="stack" id="stack" aria-label="Services"></div>
  </div>
  <div class="side-hint" id="hint">SCROLL TO EXPLORE</div>
  <div class="counter"><span id="current">01</span><i></i><span id="total">04</span></div>
</main>
<footer class="bottombar">
  <button class="bar-control" id="previous" aria-label="Previous card">←</button>
  <div class="bar-center"><span id="section-name">PHOTOGRAPHY</span><span class="bar-divider"></span><span id="section-position">01 / 04</span></div>
  <button class="bar-control" id="next" aria-label="Next card">→</button>
</footer>
<div class="contact-layer" id="contact-layer" aria-hidden="true">
  <button class="contact-close" id="contact-close" aria-label="Close">×</button>
  <a href="https://beacons.ai/storytellervs" target="_blank" rel="noreferrer">BEACONS ↗</a>
  <a href="https://www.instagram.com/storytellervs/" target="_blank" rel="noreferrer">INSTAGRAM ↗</a>
  <a href="https://www.youtube.com/@storytellervs" target="_blank" rel="noreferrer">YOUTUBE ↗</a>
  <a href="mailto:emailvstoryteller@gmail.com">EMAIL ↗</a>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
